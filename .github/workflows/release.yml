name: CI and release

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:release
      - run: pnpm pack:cli
      - run: pnpm docs:build

  publish:
    name: Publish npm package
    if: github.event_name == 'push' && github.ref_protected
    needs: check
    runs-on: ubuntu-latest
    concurrency:
      group: npm-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Find release baseline
        id: baseline
        run: |
          if git tag --merged HEAD --list 'v*' | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo '::notice::Publish the first version and push its Git tag to enable automatic releases.'
          fi
      - uses: actions/setup-node@v6
        if: steps.baseline.outputs.ready == 'true'
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: pnpm/action-setup@v6
        if: steps.baseline.outputs.ready == 'true'
      - if: steps.baseline.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile
      - name: Release
        if: steps.baseline.outputs.ready == 'true'
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ github.token }}
